# mise (https://mise.jdx.dev) 用の設定。
# Strata が必要とする Node の下限は 24.12(type stripping が stable になった版)。
# 24 系は LTS で、2026-10-20 からメンテナンス期、終了は 2028-04-30。
# "24" は 24 系の最新に解決されるので、下限の系統を使いつつ修正は取り込める。
# 最新版(26 系)での動作確認は CI の matrix(24 / 26)に任せる。
# 型検査は下限に合わせて @types/node を ~24.0 に固定してある。
#
# 利用者としてのインストール(GitHub 公開のみ):
#   mise は Node ランタイムの供給に使い、Strata 本体は Homebrew か git 導入を推奨。
#   asdf は `asdf install nodejs latest:24` で入れたあと
#   `asdf set -u nodejs latest:24` で使う版を選ぶ(install だけでは選択されない)。
[tools]
node = "24"
