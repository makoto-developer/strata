# mise (https://mise.jdx.dev) 用の設定。
# Strata が必要とする Node の下限は 22.18(TypeScript を type stripping で直接実行)。
# ここで指定するのは開発時に使う版で、下限そのものではない:
# 22.18 を指すと 22.18.0 に貼り付き、以降の v22 系の修正が当たらなくなるため、
# 開発は現行 LTS で回し、下限での動作確認は CI の matrix(22.18 / 24)に任せる。
# ただし matrix が守れるのはテストが通る経路だけで、型検査は @types/node の版に従う。
#
# 利用者としてのインストール(GitHub 公開のみ):
#   mise は Node ランタイムの供給に使い、Strata 本体は Homebrew か git 導入を推奨。
#   asdf は `asdf install nodejs latest:24` で入れ、`.tool-versions` には
#   解決後の完全なバージョンを書く(部分指定は受け付けない)。
[tools]
node = "24"
