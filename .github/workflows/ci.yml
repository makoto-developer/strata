name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18 は type stripping がデフォルト有効になった最小バージョン、24 は現行の LTS 系。
        node-version: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: "devDependencies (typescript / @types/node) をインストール"
        run: npm ci
      - name: "型チェック (tsc --noEmit)"
        run: npm run typecheck
      - name: "テスト (CLI・解析エンジン + ビューア/サーバの DOM/HTTP スモーク)"
        run: npm test
      - name: "ドキュメントの整合性 (front matter・ナビ・内部リンク)"
        run: node scripts/check-docs.mjs
