# タグ(v*)を push すると Release を作り、自動生成の変更履歴に導入手順を足す。
#
# アセットは添付しない。配布はソース導入(Homebrew / git clone)に一本化してあり、
# Homebrew が参照するソース tarball は GitHub がタグから自動生成するため。
# タグ push では ci.yml が走らない(push: [main] のため)ので、検査はここで回す。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          cache: npm

      - name: devDependencies(typescript / @types/node)をインストール
        run: npm ci

      - name: テストと型検査(壊れたものをリリースしない)
        run: |
          npm run typecheck
          npm test
          node scripts/check-docs.mjs

      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 変更履歴は GitHub の自動生成を使い、その下に導入手順・サポート範囲を足す。
          # 生成に失敗したらここで落とす。空のまま edit に進むと既存の本文を消す
          notes="${RUNNER_TEMP}/notes.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > "$notes"
          printf '\n\n' >> "$notes"
          cat .github/release-notes-footer.md >> "$notes"
          # --verify-tag: タグが消えていると gh は既定ブランチの HEAD からタグを作ってしまう
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$notes"
          fi
