syntax = "proto3";

package acme.user.v1;

// 生成物は別リポジトリで tag を打って配布される。ここに書くパスと
// 呼び出し元が import するパスは一致しない(それがこのサンプルの主題)。
option go_package = "example.com/platform/proto/acme/user/v1;userv1";

service UserService {
  // 利用者を 1 件取得する
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // 利用者を列挙する
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

message GetUserRequest { string id = 1; }
message GetUserResponse { string id = 1; string name = 2; }
message ListUsersRequest { int32 limit = 1; }
message ListUsersResponse { repeated GetUserResponse users = 1; }
