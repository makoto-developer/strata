apiVersion: v1
kind: Service
metadata:
  name: user-api
  namespace: prod
spec:
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: prod
spec:
  replicas: 3
  template:
    metadata:
      name: user-api-pod
    spec:
      containers:
        - name: app
          image: registry.example.com/user-api:1.4.0
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: prod
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: prod
